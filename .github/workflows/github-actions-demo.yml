name: GitHub Actions Demo

run-name: ${{ github.actor }} is testing out GitHub Actions 🚀

on:
  push:

jobs:
  Explore-GitHub-Actions:
    runs-on: windows-latest

    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."

      - run: echo "🪟 This job is now running on a ${{ runner.os }} server hosted by GitHub!"

      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      - name: Check out repository code
        uses: actions/checkout@v6

      - name: List files in the repository
        shell: pwsh
        run: |
          Get-ChildItem -Path $env:GITHUB_WORKSPACE

      - name: Check docs folder and required files
        shell: pwsh
        run: |
          $docsPath = Join-Path $env:GITHUB_WORKSPACE "docs"

          # Check that /docs exists
          if (-not (Test-Path -Path $docsPath -PathType Container)) {
              Write-Error "❌ ERROR: /docs folder does not exist."
              exit 1
          }

          Write-Host "✅ /docs folder exists."

          # Get files directly inside /docs
          $files = Get-ChildItem -Path $docsPath -File

          # Check for ERD image
          $erd = $files | Where-Object {
              $_.Extension.ToLower() -in @(".png", ".jpg", ".jpeg", ".svg", ".webp")
          }

          if (-not $erd) {
              Write-Error "❌ ERROR: No ERD image found in /docs."
              Write-Error "Expected: .png, .jpg, .jpeg, .svg, or .webp"
              exit 1
          }

          Write-Host "✅ ERD image found: $($erd.Name)"

          # Check for endpoint plan document
          $endpointPlan = $files | Where-Object {
              $_.Extension.ToLower() -in @(".md", ".pdf", ".docx")
          }

          if (-not $endpointPlan) {
              Write-Error "❌ ERROR: No endpoint plan document found in /docs."
              Write-Error "Expected: .md, .pdf, or .docx"
              exit 1
          }

          Write-Host "✅ Endpoint plan document found: $($endpointPlan.Name)"

          # Check for SQL script
          $sqlScript = $files | Where-Object {
              $_.Extension.ToLower() -eq ".sql"
          }

          if (-not $sqlScript) {
              Write-Error "❌ ERROR: No SQL script found in /docs."
              Write-Error "Expected a .sql file."
              exit 1
          }

          Write-Host "✅ SQL script found: $($sqlScript.Name)"

          Write-Host ""
          Write-Host "🎉 All required documentation has been found."

      - name: Show docs contents
        shell: pwsh
        run: |
          Write-Host "📚 Contents of /docs:"
          Get-ChildItem -Path "$env:GITHUB_WORKSPACE/docs" -File |
            Select-Object -ExpandProperty FullName

      - run: echo "🍏 This job's status is ${{ job.status }}."
