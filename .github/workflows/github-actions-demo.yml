name: GitHub Actions Demo

run-name: ${{ github.actor }} is testing out GitHub Actions 🚀

on:
  push:

jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest

    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."

      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"

      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      - name: Check out repository code
        uses: actions/checkout@v6

      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."

      - run: echo "🖥️ The workflow is now ready to test your code on the runner."

      - name: List files in the repository
        run: |
          ls -la "${{ github.workspace }}"

      - name: Check docs folder
        run: |
          if [ ! -d "${{ github.workspace }}/docs" ]; then
            echo "❌ ERROR: /docs folder does not exist."
            exit 1
          fi

          echo "✅ /docs folder exists."

      - name: Check for ERD image
        run: |
          if find "${{ github.workspace }}/docs" -maxdepth 1 -type f \
            \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.svg" -o -iname "*.webp" \) \
            | grep -q .; then
            echo "✅ ERD image found."
          else
            echo "❌ ERROR: No ERD image found in /docs."
            echo "Expected one of: .png, .jpg, .jpeg, .svg, .webp"
            exit 1
          fi

      - name: Check for endpoint plan document
        run: |
          if find "${{ github.workspace }}/docs" -maxdepth 1 -type f \
            \( -iname "*.md" -o -iname "*.pdf" -o -iname "*.docx" \) \
            | grep -q .; then
            echo "✅ Endpoint plan document found."
          else
            echo "❌ ERROR: No endpoint plan document found in /docs."
            echo "Expected one of: .md, .pdf, .docx"
            exit 1
          fi

      - name: Check for SQL script
        run: |
          if find "${{ github.workspace }}/docs" -maxdepth 1 -type f -iname "*.sql" | grep -q .; then
            echo "✅ SQL script found."
          else
            echo "❌ ERROR: No SQL script found in /docs."
            echo "Expected a .sql file."
            exit 1
          fi

      - name: Show docs contents
        run: |
          echo "📚 Contents of /docs:"
          find "${{ github.workspace }}/docs" -maxdepth 1 -type f -print

      - run: echo "🍏 This job's status is ${{ job.status }}."
